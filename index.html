<style>
/* ============================================================
   Premier Pet Travel · Boarding
   App shell: sticky top bar · one view at a time · fixed bottom tabs.
   Calendar = timeline, one row per cage, one column per night.
   ============================================================ */
:root{
  --bg:#EEF4FA; --surface:#FFFFFF; --ink:#1E2F45; --muted:#5F7390; --line:#D3E0EE;
  --accent:#3E6DB3; --accent-soft:#DCEBF8; --on-accent:#FFFFFF;
  --bar:#3E6DB3; --bar-ink:#FFFFFF; --res:#E9F0F8;
  --warn:#D97A2A; --warn-soft:#FDEBDD; --danger:#B3261E; --danger-soft:#FBE4E2;
  --ok:#2E7D5B; --ok-soft:#DCF2E7;
  --sP:#F0924A; --sM:#3E6DB3; --sG:#6B5CB8; --sXG:#B8436A;
  --scrim:rgba(14,30,50,.5);
  --font:'Nunito',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --cw:46px; --lw:96px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101925; --surface:#182435; --ink:#E6EEF8; --muted:#95A8C2; --line:#2A3B52;
  --accent:#7FB0E8; --accent-soft:#1E3550; --on-accent:#0B1626;
  --bar:#4F84C9; --bar-ink:#FFFFFF; --res:#1F2D40;
  --warn:#F0A05F; --warn-soft:#3E2A18; --danger:#F08A82; --danger-soft:#3C1F1D;
  --ok:#6FD0A4; --ok-soft:#1C3A2D;
  --sP:#F0A05F; --sM:#7FB0E8; --sG:#B39CE8; --sXG:#E77FA2;
  --scrim:rgba(0,0,0,.6); color-scheme:dark;}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
body.dragging{user-select:none;-webkit-user-select:none;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
img{max-width:100%}
[hidden]{display:none!important}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:3px solid var(--accent-soft);
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:10px;
  display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;letter-spacing:-.01em;line-height:1.1;color:var(--accent);min-width:0}
.brand img{width:44px;height:44px;background:#fff;border-radius:50%;flex:0 0 auto;box-shadow:0 0 0 2px var(--accent-soft)}
.brand small{display:block;font-weight:600;font-size:12px;color:var(--muted);letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topr{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.hdate{font-size:13px;color:var(--muted);white-space:nowrap;font-weight:600}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{font:inherit;font-size:12px;font-weight:800;padding:6px 9px;border:0;background:var(--surface);color:var(--muted);cursor:pointer;min-height:32px}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.wrap{padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:16px calc(96px + env(safe-area-inset-bottom,0px))}
main{max-width:980px;margin:0 auto}
h1{font-weight:800;font-size:24px;letter-spacing:-.02em;margin:0 0 2px;text-wrap:balance;line-height:1.15;color:var(--accent)}
h2{font-weight:800;font-size:17px;margin:22px 0 8px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 14px;font-size:14px}
.btn{font:inherit;font-weight:700;border-radius:999px;padding:10px 16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;min-height:44px;touch-action:manipulation}
.btn.sm{padding:6px 12px;min-height:38px}
.btn.primary{background:var(--warn);border-color:var(--warn);color:#fff;text-transform:uppercase;letter-spacing:.04em;font-size:13px}
.btn.blue{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.danger.fill{background:var(--danger);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:700;white-space:nowrap}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.plain{background:var(--res);color:var(--muted)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.sz{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font-size:10px;font-weight:800;color:#fff;flex:0 0 auto;letter-spacing:-.02em}
.sz.P{background:var(--sP)}.sz.M{background:var(--sM)}.sz.G{background:var(--sG)}.sz.XG{background:var(--sXG)}
.hint{font-size:12px;color:var(--muted)}

/* ---- calendar ---- */
.cal-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.navbtns{display:flex;gap:6px}
.legend{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 0 10px;font-size:12px;color:var(--muted)}
.legend>span{display:inline-flex;align-items:center;gap:5px}
.legend .sz{margin-right:-2px}
.legend .sw{width:22px;height:12px;border-radius:999px;background:var(--bar)}
.legend .sw.e{background:var(--warn-soft);box-shadow:inset 0 0 0 2px var(--warn)}
.cal-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface);-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.cal{position:relative;width:max-content}
.row{display:flex;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.lab{position:sticky;left:0;z-index:4;width:var(--lw);flex:0 0 var(--lw);background:var(--surface);border-right:1px solid var(--line);padding:4px 8px;display:flex;flex-direction:column;justify-content:center;font-size:13px;line-height:1.2}
.lab b{font-weight:800}
.lab small{color:var(--muted);font-size:11px}
.track{position:relative;flex:0 0 auto;background-image:repeating-linear-gradient(to right,transparent 0 calc(var(--cw) - 1px),var(--line) calc(var(--cw) - 1px) var(--cw))}
.crow{height:54px}
.crow.res .track{background-color:var(--res)}
.crow.drop-ok .track{background-color:var(--ok-soft);box-shadow:inset 0 0 0 2px var(--ok)}
.crow.drop-ok .lab{background:var(--ok-soft)}
.crow.drop-bad .track{background-color:var(--danger-soft);box-shadow:inset 0 0 0 2px var(--danger)}
.crow.drop-bad .lab{background:var(--danger-soft)}
.hrow{height:56px}.hrow .track{display:flex;background:none}
.dc{width:var(--cw);flex:0 0 var(--cw);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-variant-numeric:tabular-nums}
.dc small{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.dc b{font-size:14px;width:28px;height:28px;display:grid;place-items:center;border-radius:50%}
.dc.today b{background:var(--accent);color:var(--on-accent)}
.dc.we small{color:var(--accent)}
.frow{height:30px}.frow .track{display:flex;background:none}
.fc{width:var(--cw);flex:0 0 var(--cw);display:grid;place-items:center;font-size:12px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent)}
.fc.low{color:var(--warn)}.fc.zero{color:var(--danger)}
.zrow{height:28px;background:var(--bg)}
.zrow .lab{background:var(--bg);flex-direction:row;align-items:center;justify-content:flex-start;width:auto;flex:0 0 auto;border-right:0;white-space:nowrap;gap:6px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:800}
.zrow .lab em{font-style:normal;text-transform:none;letter-spacing:0;font-weight:400}
.tcol{position:absolute;top:0;bottom:0;width:var(--cw);background:var(--accent-soft);opacity:.55;pointer-events:none}
.bar{position:absolute;top:9px;height:36px;border-radius:999px;background:var(--bar);color:var(--bar-ink);border:0;display:flex;align-items:center;gap:4px;padding:0 10px 0 7px;font:inherit;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;cursor:grab;text-align:left;z-index:2;touch-action:pan-x pan-y}
.bar.cl{border-top-left-radius:0;border-bottom-left-radius:0}
.bar.cr{border-top-right-radius:0;border-bottom-right-radius:0}
.bar.emg{background:var(--warn-soft);color:var(--ink);box-shadow:inset 0 0 0 2px var(--warn)}
.bar.half{height:19px;font-size:11px;top:6px}.bar.half.l1{top:29px}
.bar.half .sz{width:15px;height:15px;font-size:8px}
.bar .nm{overflow:hidden;text-overflow:ellipsis;margin-left:3px}
.bar .sz{box-shadow:0 0 0 1.5px rgba(255,255,255,.9)}
.bar.lift{opacity:.35}
.ghost{position:fixed;z-index:60;pointer-events:none;opacity:.92;box-shadow:0 10px 28px rgba(0,0,0,.28);transform:translate(-50%,-50%) scale(1.04);cursor:grabbing}
.ghost .sz{box-shadow:0 0 0 1.5px rgba(255,255,255,.9)}
.dragtip{position:fixed;left:50%;transform:translateX(-50%);top:calc(70px + env(safe-area-inset-top,0px));z-index:61;background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;font-weight:700;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.dragtip.ok{background:var(--ok);color:#fff}.dragtip.bad{background:var(--danger);color:#fff}

/* ---- lists & stats ---- */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:680px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat .n{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1;color:var(--accent)}
.stat .t{color:var(--muted);font-size:13px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;width:100%;text-align:left;font:inherit;color:inherit;min-height:56px}
.item .badges{display:flex;gap:2px;flex:0 0 auto}
.item .badges .sz{box-shadow:0 0 0 1.5px var(--surface)}
.item .tx{flex:1;min-width:0}
.item .tx b{display:block;color:var(--accent)}
.item .tx span{color:var(--muted);font-size:13px}
.item .rt{flex:0 0 auto;text-align:right;font-size:13px}
.empty{color:var(--muted);font-size:14px;padding:12px;border:1px dashed var(--line);border-radius:12px}
.alert{display:flex;gap:10px;align-items:flex-start;background:var(--warn-soft);border-radius:12px;padding:10px 12px;font-size:14px}
.alert b{color:var(--warn)}

/* ---- forms ---- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.flab{font-size:13px;font-weight:700}
input,select,textarea{font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);width:100%;min-width:0;min-height:44px}
textarea{resize:vertical;min-height:48px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:40px;touch-action:manipulation}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.seg button[aria-pressed="true"] .sz{box-shadow:0 0 0 1.5px rgba(255,255,255,.9)}
.dogblock{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.dogblock h3{margin:0;font-size:16px;font-weight:800}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.opt{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.opt.w{border-color:var(--warn)}
.opt .r1{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.opt .cg{font-size:18px;font-weight:800}
.opt p{margin:0;font-size:13px;color:var(--muted)}
.opt .r2{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.err{color:var(--danger);background:var(--danger-soft);padding:10px 12px;border-radius:10px;font-size:14px}
.no{background:var(--danger-soft);color:var(--danger);border-radius:12px;padding:12px 14px;font-size:14px}
.okbox{background:var(--ok-soft);color:var(--ok);border-radius:12px;padding:12px 14px;font-size:14px}

/* ---- tabs ---- */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tab{background:none;border:0;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font:inherit;font-size:12px;font-weight:600;cursor:pointer;min-height:56px;touch-action:manipulation}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent);font-weight:800}

/* ---- sheets ---- */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:18px 18px 0 0;max-height:88%;overflow:auto;max-width:640px;margin:0 auto;
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:10px calc(22px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out;-webkit-overflow-scrolling:touch}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sheet h2{margin:0 0 2px;font-size:22px;color:var(--accent)}
.shead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:12px 0}
.kv dt{color:var(--muted)}.kv dd{margin:0;min-width:0}
.dogcard{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:8px;width:100%;text-align:left;font:inherit;color:inherit;background:var(--surface);cursor:pointer}
.dogcard .hd{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.dogcard .hd b{font-size:16px}
.dogcard .hd .go{margin-left:auto;color:var(--accent);font-weight:800;font-size:13px}
.dogcard dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:14px}
.dogcard dt{color:var(--muted)}.dogcard dd{margin:0}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;align-items:center}
.moverow{display:flex;gap:8px;align-items:center;margin-top:14px;flex-wrap:wrap}
.moverow select{flex:1;min-width:160px}
.obs{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.obs .oh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.obs .tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:2px}
.obs p{margin:6px 0 0;font-size:14px}
.obsrow{display:flex;gap:8px;align-items:center}
.obsrow input{flex:1}
.obsx{min-height:32px;padding:2px 11px;line-height:1}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer}
.chk input{width:22px;height:22px;min-height:0;padding:0;flex:0 0 auto;margin:0;accent-color:var(--accent)}
.sheet h2.sech{font-size:16px;color:var(--ink);margin:20px 0 8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--accent);color:#fff;padding:10px 16px;border-radius:999px;font-weight:700;font-size:14px;z-index:70;max-width:calc(100% - 32px);text-align:center}
.toast.bad{background:var(--danger)}
.syncdot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.syncdot.local{background:var(--muted)}

/* ---- v3: clearer, larger, cats, clients ---- */
:root{--sC:#1E8A8A; --lw:84px; --vet:#D32F2F}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--sC:#5CC6C6; --vet:#FF6B5E}}
body{font-size:16px}
.sub{font-size:15px}
.hint{font-size:13px}
.chip{font-size:13px;padding:3px 10px}
.btn{min-height:48px;font-size:16px}
.btn.sm{min-height:42px;font-size:15px;padding:6px 14px}
.btn.primary{font-size:15px}
.btn.big{flex:1 1 220px}
a.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.tab{font-size:13px}
.item .tx span{font-size:14px}
.item .tx .gline{display:block;color:var(--accent);font-weight:700}
.item .rt.go{color:var(--accent);font-weight:800;font-size:15px}
.field label,.flab{font-size:15px}
input,select,textarea{font-size:17px;min-height:48px}
.seg button{font-size:15px;min-height:44px;padding:8px 14px}
.seg button.num{min-width:48px;justify-content:center;font-weight:800}
.sz.C{background:var(--sC)}
.hdate{display:none}
@media (min-width:560px){.hdate{display:inline}}
.aplus{font:inherit;font-weight:800;font-size:15px;min-width:44px;min-height:36px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.aplus b{font-size:11px;vertical-align:super}
.aplus[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
body.big .wrap,body.big .sheet,body.big nav.tabs{zoom:1.15}
body.authing nav.tabs{display:none}
.spsw{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 14px}
.spsw button{font:inherit;font-weight:800;font-size:17px;min-height:52px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;touch-action:manipulation}
.spsw button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
button.stat{font:inherit;color:inherit;text-align:left;cursor:pointer;width:100%}
h2[id]{scroll-margin-top:84px}
.cal-head{align-items:center}
.cal-head h1{margin:0}
.crow.off .track{background-image:repeating-linear-gradient(135deg,transparent 0 8px,var(--line) 8px 10px);background-color:var(--bg)}
.crow.off .lab{color:var(--muted);background:var(--bg)}
.card+.card{margin-top:12px}
.step{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;margin:0;flex-wrap:wrap}
.step i{font-style:normal;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:inline-grid;place-items:center;font-size:16px;flex:0 0 auto}
.orline{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px;font-weight:700}
.orline::before,.orline::after{content:"";flex:1;height:1px;background:var(--line)}
.newpet{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.chosen{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--accent-soft);border-radius:12px;padding:10px 12px}
.chosen b{font-size:17px}
.pick{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 12px;min-height:56px;cursor:pointer;touch-action:manipulation}
.pick .tx{display:flex;flex-direction:column}
.pick .box{width:26px;height:26px;border-radius:7px;border:2px solid var(--muted);flex:0 0 auto;display:grid;place-items:center;font-weight:800;color:transparent}
.pick[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.pick[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.linkbtn{font:inherit;background:none;border:0;color:var(--accent);font-weight:800;text-decoration:underline;cursor:pointer;padding:4px 2px;min-height:36px}
.foot{font-size:13px;color:var(--muted);margin:26px 0 0;text-align:center}
.tel{font-variant-numeric:tabular-nums;font-weight:700}
.telrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.telbtns{display:inline-flex;gap:6px}
.petcard{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:8px;background:var(--surface)}
.petcard .hd{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.petcard .hd b{font-size:17px}
.petcard .hd .go{margin-left:auto}
.petcard dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:15px}
.petcard dt{color:var(--muted)}.petcard dd{margin:0}
.grow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:10px;padding-top:10px}
.warnt{color:var(--warn)}
.alert.item{background:var(--warn-soft);border-color:transparent;align-items:flex-start;min-height:0}
.kv{font-size:15px}
.obsx{min-height:36px;font-size:14px}

/* ---- follow-up of health problems ---- */
.issue{background:var(--warn-soft);border:2px solid transparent;border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.issue.red{background:var(--danger-soft);border-color:var(--danger)}
.ihead{display:flex;gap:10px;align-items:flex-start;text-align:left;font:inherit;font-size:15px;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.ihead b{color:var(--warn)}.issue.red .ihead b{color:var(--danger)}
.imeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip.bad{background:var(--danger);color:#fff}
.irow{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.issue .seg button{background:var(--surface)}
.issue .seg button[aria-pressed="true"]{background:var(--accent)}
.btn.fine{align-self:flex-start;background:var(--surface);color:var(--ok);border-color:var(--ok)}
.badt{color:var(--danger)}
.obs.minor{padding:6px 12px;background:transparent;border-style:dashed}
.obs.minor p{margin:0;font-size:14px;color:var(--muted)}

/* ---- vet visit: red cross ---- */
.vx{color:var(--vet);font-weight:800}
.bar .vx{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;background:#fff;color:#D32F2F;font-size:11px;line-height:1;vertical-align:-3px}
.bar.half .vx{width:13px;height:13px;font-size:9px;vertical-align:-2px}

/* ---- narrower kennel column, so more of the calendar fits on a phone ---- */
.lab{padding:4px 6px}
.lab b{overflow-wrap:anywhere}
.lab small{line-height:1.15}
</style>

const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
let lang=LS.get('ppt.lang')||((navigator.language||'en').startsWith('es')?'es':'en');
let T=I18N[lang];
let sp=LS.get('ppt.sp')==='cat'?'cat':'dog';          /* which animals the screen is showing */
function setLang(l){syncForms();lang=l;T=I18N[l];LS.set('ppt.lang',l);document.documentElement.lang=l;chrome();render()}
const nP=(n,k)=>`${n} ${T.spn[k][n===1?0:1]}`;

/* ============================================================
   2. DATES
   ============================================================ */
const DAY=86400000;
const iso=d=>d.toISOString().slice(0,10);
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(Date.UTC(y,m-1,d))};
const add=(s,n)=>iso(new Date(parse(s).getTime()+n*DAY));
const diff=(a,b)=>Math.round((parse(b)-parse(a))/DAY);
const _n=new Date();
const TODAY=iso(new Date(Date.UTC(_n.getFullYear(),_n.getMonth(),_n.getDate())));
const fmt=s=>{const d=parse(s);return `${T.wd[d.getUTCDay()]} ${d.getUTCDate()} ${T.mon[d.getUTCMonth()]}`};
const fmtLong=s=>{const d=parse(s);return lang==='es'?`${T.wdl[d.getUTCDay()]} ${d.getUTCDate()} de ${T.monl[d.getUTCMonth()]}`:`${T.wdl[d.getUTCDay()]} ${d.getUTCDate()} ${T.monl[d.getUTCMonth()]}`};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);

/* ============================================================
   3. KENNELS & RULES
   Dog sizes: P small · M medium · G large · XG extra large.  Cats use size "C".
   A kennel takes its listed sizes; a smaller dog always fits where a bigger one does.
   max    = the most animals the kennel can physically hold
   normal = how many it usually holds (cat kennels allow one extra: max = normal + 1)
   ============================================================ */
const BREEDS=[['Chihuahua','Chihuahua','P'],['Yorkshire','Yorkshire','P'],['Miniature Pinscher','Mini Pinscher','P'],['Whippet','Whippet','P'],['Jack Russell','Jack Russell','P'],['Maltese','Bichón Maltés','P'],
 ['Beagle','Beagle','M'],['Cocker Spaniel','Cocker Spaniel','M'],['Labrador','Labrador','M'],['Golden Retriever','Golden Retriever','M'],['Springer Spaniel','Springer Spaniel','M'],['Border Collie','Border Collie','M'],
 ['German Shepherd','Pastor Alemán','G'],['Belgian Shepherd','Pastor Belga','G'],['Husky','Husky','G'],['Doberman','Dóberman','G'],['Rottweiler','Rottweiler','G'],
 ['Mastiff','Mastín','XG'],['Great Dane','Gran Danés','XG'],['Saint Bernard','San Bernardo','XG'],['Mixed / other','Mestizo / otra','M']];
const breedLabel=b=>{const x=BREEDS.find(r=>r[0]===b);return x?(lang==='es'?x[1]:x[0]):(b||'')};
const breedFind=t=>{const s=String(t||'').trim().toLowerCase();return s?BREEDS.find(r=>r[0].toLowerCase()===s||r[1].toLowerCase()===s):null};
const breedKey=t=>{const x=breedFind(t);return x?x[0]:String(t||'').trim()};   /* known breed → canonical name · anything else → as typed */
const breedSize=b=>(BREEDS.find(x=>x[0]===b)||[0,0,'M'])[2];
const LUCY=['Ringo','Ludo','Bosley','Jaxon'];
const ALL=['P','M','G','XG'];
const CAGES=[];
const K=o=>{const c=Object.assign({sp:'dog',pair:[],max:1,tier:1},o);if(c.normal===undefined)c.normal=c.max;CAGES.push(c)};
[1,2,3].forEach(n=>K({id:'J'+n,zone:'small',n,sizes:['P'],hint:'h_small'}));
K({id:'J4',zone:'small',n:4,sizes:['P','M'],pair:['P','M'],max:2,hint:'h_upto2'});
for(let i=1;i<=6;i++)K({id:'M'+i,zone:'wood',n:i,sizes:['P','M','G'],hint:'h_wood'});
K({id:'R2',zone:'rec2',n:0,sizes:ALL,pair:['P','M','G'],max:2,tier:2,hint:'h_rec2'});
for(let i=1;i<=4;i++)K({id:'R1-'+i,zone:'rec1',n:i,sizes:['P','M','G'],tier:3,res:LUCY[i-1]});
for(let i=1;i<=6;i++)K({id:'G'+i,zone:'large',n:i,sizes:ALL,pair:i>=5?['P','M','G']:[],max:i>=5?2:1,tier:4,hint:i>=5?'h_upto2':'h_large'});
/* cat kennels: usual number of cats per kennel (0 = not in use) */
const CAT_NORMAL={1:3,2:3,3:0,4:1,5:1,6:1,7:3,8:4};
const CAT_EXTRA=1;
for(let i=1;i<=8;i++){const k=CAT_NORMAL[i];K({id:'C'+i,sp:'cat',zone:'cats',n:i,sizes:['C'],pair:['C'],normal:k,max:k?k+CAT_EXTRA:0,off:!k})}
const CAGE=Object.fromEntries(CAGES.map(c=>[c.id,c]));
const ZONES={dog:['small','wood','rec2','rec1','large'],cat:['cats']};
const cagesOf=k=>CAGES.filter(c=>c.sp===k&&!c.off);
const cname=c=>{c=typeof c==='string'?CAGE[c]:c;switch(c.zone){case'small':return `${T.cage} ${c.n}`;case'wood':return `${T.wood} ${c.n}`;case'rec2':return T.rec2;case'rec1':return `${T.rec1} · ${c.n}`;case'cats':return `${T.catk} ${c.n}`;default:return `${T.large} ${c.n}`}};
/* short name for the narrow calendar column: the row group already says these are cat kennels */
const clabel=c=>c.zone==='cats'?`${T.sp1.cat} ${c.n}`:cname(c);
const chint=c=>c.off?T.h_off:c.res?`${c.res} (Lucy)`:c.sp==='cat'?T.h_cat(c.normal):T[c.hint];
const TIER={1:['t1',''],2:['t2',''],3:['t3','warn'],4:['t4','warn'],5:['t5','warn']};

const bPets=b=>b.pets.map(petById).filter(Boolean);
const bSizes=b=>b.sizes||bPets(b).map(d=>d.size);
const bSp=b=>CAGE[b.cage].sp;

/* returns null if these animals fit in kennel c for [s,e), otherwise a reason key */
function why(c,sizes,fam,s,e,pending=[],exclude=null){
  if(c.off)return 'm_off';
  const n=sizes.length;
  if(!sizes.every(z=>c.sizes.includes(z)))return 'm_size';
  if(n>c.max)return 'm_full';
  if(n>1&&!sizes.every(z=>c.pair.includes(z)))return 'm_pair';
  const all=bookings.filter(b=>b.id!==exclude).concat(pending);
  for(let d=s;d<e;d=add(d,1)){
    const here=all.filter(b=>b.cage===c.id&&covers(b,d));
    if(here.length){
      if(here.some(b=>b.fam!==fam))return 'm_family';
      const zs=here.flatMap(b=>bSizes(b)).concat(sizes);
      if(zs.length>c.max)return 'm_full';
      if(!zs.every(z=>c.pair.includes(z)))return 'm_pair';
    }else if(c.res){
      const used=new Set(all.filter(b=>CAGE[b.cage].res&&covers(b,d)).map(b=>b.cage));
      if(used.size>=2)return 'm_rec1';
    }
  }
  return null;
}
const fits=(c,sizes,fam,s,e,pending=[])=>why(c,sizes,fam,s,e,pending)===null;
function canMove(b,cageId){
  if(cageId===b.cage)return 'm_same';
  return why(CAGE[cageId],bSizes(b),b.fam,b.start,b.end,[],b.id);
}
/* lower score = suggested first */
function score(c,sizes){
  const n=sizes.length;
  if(c.sp==='cat')return n>c.normal?40+(n-c.normal):10+(c.normal-n)*.5;      /* tightest fit first, the extra cat only as a last resort */
  const big=sizes.some(z=>z!=='P');
  let p=0;
  if(c.zone==='small')p=big?1:0;
  if(c.zone==='wood')p=big?0:1;
  if(n===1&&c.max>1)p+=.5;
  return c.tier*10+p;
}
const partTier=parts=>parts.some(p=>p.idx.length>CAGE[p.cage].normal)?5:Math.max(...parts.map(p=>CAGE[p.cage].tier));
const RANK={P:0,M:1,G:2,XG:3,C:0};
/* every way of splitting n animals into groups of at most maxBlock */
function partitions(n,maxBlock){
  const res=[];
  (function rec(i,blocks){
    if(i===n){res.push(blocks.map(b=>b.slice()));return}
    for(const b of blocks){if(b.length<maxBlock){b.push(i);rec(i+1,blocks);b.pop()}}
    blocks.push([i]);rec(i+1,blocks);blocks.pop();
  })(0,[]);
  return res;
}
function suggestMany(sizes,fam,s,e,k){
  const cages=cagesOf(k),maxBlock=Math.max(...cages.map(c=>c.max));
  const splitPen=k==='cat'?1:.1,shareBonus=k==='cat'?0:.2;
  const out=[],seen=new Set(),tried=new Set();
  const big=g=>Math.max(...g.map(i=>RANK[sizes[i]]));
  for(const part of partitions(sizes.length,maxBlock)){
    const sig=part.map(g=>g.map(i=>sizes[i]).sort().join('')).sort().join('|');
    if(tried.has(sig))continue;tried.add(sig);
    const groups=part.slice().sort((a,b)=>b.length-a.length||big(b)-big(a));
    let nodes=0;
    const dfs=(gi,pend,used,acc)=>{
      if(gi===groups.length)return acc;
      const g=groups[gi],zs=g.map(i=>sizes[i]);
      const cands=cages.filter(c=>!used.has(c.id)&&fits(c,zs,fam,s,e,pend)).sort((a,b)=>score(a,zs)-score(b,zs));
      for(const c of cands){
        if(++nodes>600)return null;
        const r=dfs(gi+1,pend.concat([{cage:c.id,fam,start:s,end:e,sizes:zs}]),new Set(used).add(c.id),
          acc.concat([{cage:c.id,idx:g,sc:score(c,zs)-(g.length>1?shareBonus:0)}]));
        if(r)return r;
      }
      return null;
    };
    const sol=dfs(0,[],new Set(),[]);
    if(!sol)continue;
    const key=sol.map(p=>p.cage+':'+p.idx.map(i=>sizes[i]).sort().join('')).sort().join('|');
    if(seen.has(key))continue;seen.add(key);
    sol.sort((a,b)=>a.idx[0]-b.idx[0]);
    const parts=sol.map(p=>({cage:p.cage,idx:p.idx}));
    out.push({parts,tier:partTier(parts),shared:sol.some(p=>p.idx.length>1),
      score:Math.max(...sol.map(p=>p.sc))+splitPen*(sol.length-1)+.001*sol.reduce((a,p)=>a+p.sc,0)});
  }
  return out.sort((x,y)=>x.score-y.score).slice(0,6);
}
function suggest(sizes,fam,s,e,k){
  if(sizes.length>2)return suggestMany(sizes,fam,s,e,k);
  const cages=cagesOf(k),out=[];
  const splitPen=k==='cat'?1:.1,shareBonus=k==='cat'?0:.2;
  const single=(z,pend)=>cages.filter(c=>fits(c,[z],fam,s,e,pend)).sort((a,b)=>score(a,[z])-score(b,[z]));
  const mk=(parts,sc,shared)=>({parts,tier:partTier(parts),score:sc,shared});
  if(sizes.length===1){
    single(sizes[0],[]).forEach(c=>out.push(mk([{cage:c.id,idx:[0]}],score(c,sizes))));
  }else{
    cages.filter(c=>fits(c,sizes,fam,s,e)).forEach(c=>out.push(mk([{cage:c.id,idx:[0,1]}],score(c,sizes)-shareBonus,true)));
    const a=single(sizes[0],[])[0];
    if(a){
      const pend=[{cage:a.id,fam,start:s,end:e,sizes:[sizes[0]]}];
      const b=single(sizes[1],pend).filter(c=>c.id!==a.id)[0];
      if(b)out.push(mk([{cage:a.id,idx:[0]},{cage:b.id,idx:[1]}],Math.max(score(a,[sizes[0]]),score(b,[sizes[1]]))+splitPen));
    }
  }
  return out.sort((x,y)=>x.score-y.score).slice(0,6);
}
function freeCount(d,k){
  let n=0;const r1=new Set();
  cagesOf(k).forEach(c=>{
    const occ=bookings.some(b=>b.cage===c.id&&covers(b,d));
    if(c.res){if(occ)r1.add(c.id)}else if(!occ)n++;

  return k==='dog'?n+Math.max(0,2-r1.size):n;
}

/* ---------- Today ---------- */
function item(b,right){

}
function viewToday(){
  const B=bks(sp),cnt=a=>a.reduce((n,b)=>n+b.pets.length,0);
  const stay=B.filter(b=>covers(b,TODAY)),ins=B.filter(b=>b.start===TODAY),outs=B.filter(b=>b.end===TODAY);
  const here=stay.concat(outs);                                   /* everyone on site at some point today */
  const rows=here.flatMap(b=>bPets(b).map(d=>({b,d})));
  const meds=rows.filter(x=>x.d.meds);
  const since=Date.now()-48*3600*1000;
  const issues=rows.flatMap(x=>openIssues(x.d.id).map(i=>({b:x.b,d:x.d,i}))).sort((a,b)=>issueRed(b.i)-issueRed(a.i)||issueDay(b.i)-issueDay(a.i));
  const obsNow=rows.map(x=>Object.assign({o:obsOf(x.d.id).find(o=>o.kind==='note')},x)).filter(x=>x.o&&new Date(x.o.at).getTime()>=since);
  const svcs=SERVICES.flatMap(s=>rows.filter(x=>x.b[s.k].includes(x.d.id)).map(x=>Object.assign({s},x)));
  const emg=stay.filter(isEmg);
  const other=sp==='dog'?'cat':'dog',OB=bks(other);
  const oT=cnt(OB.filter(b=>covers(b,TODAY)))+(other==='dog'?LUCY.length:0),oA=cnt(OB.filter(b=>b.start===TODAY));
  let h=`<h1>${cap(fmtLong(TODAY))}</h1><p class="sub">${T.today_sub[sp]}</p>${spSwitch()}
  <div class="stats">
   <button class="stat" data-act="goto" data-to="sec-stay"><div class="n">${cnt(stay)+(sp==='dog'?LUCY.length:0)}</div><div class="t">${T.tonight_n[sp]}${sp==='dog'?`<br><span class="hint">${T.incl_lucy(LUCY.length)}</span>`:''}</div></button>
   <button class="stat" data-view="cal"><div class="n">${freeCount(TODAY,sp)}</div><div class="t">${T.free_tonight}</div></button>
   <button class="stat" data-act="goto" data-to="sec-in"><div class="n">${cnt(ins)}</div><div class="t">${T.arriving}</div></button>
   <button class="stat" data-act="goto" data-to="sec-out"><div class="n">${cnt(outs)}</div><div class="t">${T.leaving}</div></button>
  </div>`;
  if(meds.length||emg.length||obsNow.length||svcs.length||issues.length){
    h+=`<h2>${T.attention}</h2><div class="list">`;
    issues.forEach(x=>h+=issueCard(x.i,x.d,x.b,'',false));
    meds.forEach(x=>h+=`<button class="alert item" data-act="pet" data-p="${x.d.id}"><b>💊</b><span><b>${esc(x.d.name)}</b> (${cname(x.b.cage)}): ${esc(x.d.meds)}</span></button>`);
    obsNow.forEach(x=>h+=`<button class="alert item" data-act="pet" data-p="${x.d.id}"><b>🩺</b><span><b>${esc(x.d.name)}</b> (${cname(x.b.cage)}): ${obsLine(x.o)} <span class="hint">· ${fmtAt(x.o.at)}</span></span></button>`);
    svcs.forEach(x=>h+=`<button class="alert item" data-b="${x.b.id}"><b>${x.s.icon}</b><span>${T.svc_due(T[x.s.k],`<b>${esc(x.d.name)}</b>`,cname(x.b.cage),fmt(x.b.end))}</span></button>`);
    emg.forEach(b=>{const c=CAGE[b.cage],n=`<b>${esc(names(b))}</b>`;h+=`<button class="alert item" data-b="${b.id}"><b>!</b><span>${c.res?T.emg_rec1(n,b.cage):isOver(b)?T.emg_over(n,cname(c),c.normal):T.emg_large(n,cname(c))}</span></button>`});
    h+=`</div>`;
  }
  const rest=stay.filter(b=>b.start!==TODAY);
  h+=`<h2 id="sec-in">${T.arriving}</h2>`+(ins.length?`<div class="list">${ins.map(b=>item(b)).join('')}</div>`:`<div class="empty">${T.nobody_in}</div>`);
  h+=`<h2 id="sec-out">${T.leaving}</h2>`+(outs.length?`<div class="list">${outs.map(b=>item(b)).join('')}</div>`:`<div class="empty">${T.nobody_out}</div>`);
  h+=`<h2 id="sec-stay">${T.staying}</h2>`+(rest.length?`<div class="list">${rest.map(b=>item(b,T.leaves(fmt(b.end)))).join('')}</div>`:`<div class="empty">${T.nobody_stay}</div>`);
  h+=`<h2>${T.Sp[other]}</h2><button class="item" data-act="sp" data-sp="${other}"><span class="tx"><b>${T.Sp[other]}</b><span>${T.other_sp(oT,oA)}</span></span><span class="rt go">${T.see}</span></button>`;
  return h+statusFoot();
}

/* ---------- Calendar ---------- */
function viewCal(){
  const end=add(calStart,DAYS-1);
  const a=parse(calStart),b=parse(end);
  const ml=a.getUTCMonth()===b.getUTCMonth()?`${cap(T.monl[a.getUTCMonth()])} ${a.getUTCFullYear()}`:`${cap(T.monl[a.getUTCMonth()])} – ${cap(T.monl[b.getUTCMonth()])}`;
  const W=`calc(var(--cw) * ${DAYS})`;
  const ti=diff(calStart,TODAY);
  const tcol=(ti>=0&&ti<DAYS)?`<div class="tcol" style="left:calc(var(--cw) * ${ti})"></div>`:'';
  let h=`${spSwitch()}<div class="cal-head"><h1>${ml}</h1>
  <div class="navbtns"><button class="btn sm" data-act="prev">‹ ${T.prev}</button><button class="btn sm" data-act="today">${T.today}</button><button class="btn sm" data-act="next">${T.next} ›</button></div></div>
  <p class="sub">${T.cal_tap}</p>
  <div class="legend"><span><i class="sw"></i>${T.lg_stay}</span>${sp==='dog'
    ?`<span><i class="sw e"></i>${T.lg_emg}</span><span>${badges(ALL)} ${T.lg_size}</span><span>✂ ${T.lg_groom}</span><span><span class="vx">✚</span> ${T.lg_vet}</span>`
    :`<span><i class="sw e"></i>${T.lg_over}</span><span>${badges(['C','C'])} ${T.lg_cats}</span><span><span class="vx">✚</span> ${T.lg_vet}</span>`}</div>
  <div class="cal-scroll" id="calScroll"><div class="cal">`;
  let days='',free='';
  for(let i=0;i<DAYS;i++){
    const d=add(calStart,i),dt=parse(d),wd=dt.getUTCDay();
    days+=`<div class="dc${d===TODAY?' today':''}${wd===0||wd===6?' we':''}"><small>${T.wd[wd].slice(0,2)}</small><b>${dt.getUTCDate()}</b></div>`;
    const f=freeCount(d,sp);
    free+=`<div class="fc${f===0?' zero':f<=(sp==='dog'?3:1)?' low':''}">${f}</div>`;
  }
  h+=`<div class="row hrow"><div class="lab"><small>${T.cage}</small></div><div class="track" style="width:${W}">${days}</div></div>`;
  h+=`<div class="row frow"><div class="lab"><small>${T.free}</small></div><div class="track" style="width:${W}">${free}</div></div>`;
  ZONES[sp].forEach(z=>{
    const note=z==='rec1'?T.z_rec1_note:z==='large'?T.z_large_note:z==='cats'?T.z_cats_note:'';
    h+=`<div class="row zrow"><div class="lab">${T['z_'+z]}${note?` <em>· ${note}</em>`:''}</div></div>`;
    CAGES.filter(c=>c.zone===z).forEach(c=>{
      h+=`<div class="row crow${c.res?' res':''}${c.off?' off':''}" data-cage="${c.id}"><div class="lab"><b>${clabel(c)}</b><small>${chint(c)}</small></div><div class="track" style="width:${W}">${c.off?'':tcol+cageBars(c)}</div></div>`;
    });
  });
  return h+`</div></div>`;
}
function cageBars(c){
  const rEnd=add(calStart,DAYS);
  const bs=bookings.filter(b=>b.cage===c.id&&b.start<rEnd&&b.end>calStart).sort((a,b)=>a.start<b.start?-1:1);
  const lanes=[];bs.forEach(b=>{let l=lanes.findIndex(e=>e<=b.start);if(l<0){l=lanes.length;lanes.push(b.end)}else lanes[l]=b.end;b._l=l});
  const half=lanes.length>1;
  return bs.map(b=>{
    const x0=diff(calStart,b.start)+.5,x1=diff(calStart,b.end)+.5;
    const L=Math.max(x0,0),R=Math.min(x1,DAYS);
    if(R<=L)return'';
    const cls=['bar'];if(x0<0)cls.push('cl');if(x1>DAYS)cls.push('cr');if(isEmg(b))cls.push('emg');if(half)cls.push('half','l'+Math.min(b._l,1));
    const narrow=(R-L)<1.6;
    return `<button class="${cls.join(' ')}" data-b="${b.id}" style="left:calc(var(--cw) * ${L});width:calc(var(--cw) * ${R-L})" aria-label="${esc(names(b))}, ${fmt(b.start)} – ${fmt(b.end)}">${badges(bSizes(b))}${narrow?'':`<span class="nm">${svcIcons(b)?svcIcons(b)+' ':''}${esc(names(b))}</span>`}</button>`;
  }).join('');
}

function famMatch(f,q){
  q=q.trim().toLowerCase();if(!q)return true;
  if(f.name.toLowerCase().includes(q))return true;
  if(pets.some(p=>p.fam===f.id&&p.name.toLowerCase().includes(q)))return true;
  const dq=q.replace(/\D/g,'');return dq.length>=3&&(f.phone||'').replace(/\D/g,'').includes(dq);
}
const famPetsLine=f=>pets.filter(p=>p.fam===f.id).map(p=>esc(p.name)).join(', ');
function nbClientList(){
  const box=$('#nb-clients');if(!box)return;
  const q=nb.q.trim();
  const count=id=>bookings.filter(b=>b.fam===id).length;
  const has=id=>pets.some(p=>p.fam===id&&p.species===sp)?1:0;      /* clients who already have this kind of animal come first */
  const list=q?families.filter(f=>famMatch(f,q)).sort((a,b)=>a.name.localeCompare(b.name)).slice(0,6)
              :families.filter(f=>count(f.id)>1).sort((a,b)=>has(b.id)-has(a.id)||count(b.id)-count(a.id)).slice(0,4);
  if(!list.length){box.innerHTML=q?`<p class="hint" style="margin:0">${T.no_match}</p>`:'';return}
  box.innerHTML=(q?'':`<span class="flab">${T.frequent}</span>`)+`<div class="list">${list.map(f=>`<button type="button" class="item" data-act="nbclient" data-f="${f.id}"><span class="tx"><b>${esc(f.name)}</b><span>${famPetsLine(f)||'—'}</span></span></button>`).join('')}</div>`;
}
function optHTML(o,i,labels){
  const [tk,tc]=TIER[o.tier];
  const cg=o.parts.map(p=>cname(p.cage)).join(' + ');
  const notes=[];
  if(o.parts.length>1)notes.push(T.n_each+o.parts.map(p=>`${p.idx.map(k=>labels[k]).join(' + ')} → ${cname(p.cage)}`).join(', ')+'.');
  if(o.shared)notes.push(T.n_share[sp]);
  o.parts.forEach(p=>{const c=CAGE[p.cage];if(c.res)notes.push(T.n_rec1(c.res));if(p.idx.length>c.normal)notes.push(T.n_over(cname(c),nP(c.normal,c.sp)))});
  if(o.tier===4)notes.push(T.n_large);
  return `<div class="opt${tc?' w':''}"><div class="r1"><span class="cg">${cg}</span><span class="chip${tc?' warn':''}">${i===0?T.best+' · ':''}${T[tk]}</span></div>${notes.length?`<p>${notes.join(' ')}</p>`:''}<div class="r2"><span class="hint">${T.n_cages(o.parts.length)}</span><button class="btn primary" type="button" data-act="nbbook" data-o="${i}">${T.book_this}</button></div></div>`;
}
function nbResults(){
  const box=$('#nb-res');if(!box)return;

  if(sizes.length>MAXD){box.innerHTML=`<div class="err">${T.too_many(MAXD)}</div>`;return}
  const what=sp==='cat'?nP(sizes.length,'cat'):`${nP(sizes.length,'dog')} (${ALL.map(z=>[sizes.filter(x=>x===z).length,z]).filter(x=>x[0]).map(([n,z])=>`${n} × ${T.sizes[z].toLowerCase()}`).join(', ')})`;
  const o=suggest(sizes,nb.client||'__new',nb.s,nb.e,sp);nb.opts=o;

}

}
function syncDetails(){
  const v=id=>{const el=document.getElementById(id);return el?el.value:null};
  const set=(o,k,x)=>{if(x!==null)o[k]=x.trim()};
  set(nb,'fname',v('nd-fname'));set(nb,'phone',v('nd-phone'));
  for(let i=0;i<nb.nNew;i++){const d=nb.news[i];
    set(d,'name',v(`nd-p${i}-name`));const br=v(`nd-p${i}-breed`);if(br!==null)d.breed=breedKey(br);
    const sz=v(`nd-p${i}-size`);if(sz)d.size=sz;
    set(d,'food',v(`nd-p${i}-food`));set(d,'meds',v(`nd-p${i}-meds`));set(d,'notes',v(`nd-p${i}-notes`));}
}
let saving=false;
async function nbSave(){
  if(saving)return;
  syncDetails();
  const box=$('#nd-err'),errs=[];
  if(!nb.client&&!nb.fname)errs.push(T.e_fam);
  for(let i=0;i<nb.nNew;i++)if(!nb.news[i].name)errs.push(T.e_pet(T.new_n(sp,i+1).toLowerCase()));
  if(errs.length){box.innerHTML=`<div class="err">${errs.join('<br>')}</div>`;box.scrollIntoView({block:'center'});return}
  saving=true;
  try{
    await Store.refresh();                                          /* someone else may have booked meanwhile */
    const famKey=nb.client||'__new',sizes=nbSizes(),pend=[];
    for(const p of nb.opt.parts){
      const zs=p.idx.map(i=>sizes[i]);
      if(why(CAGE[p.cage],zs,famKey,nb.s,nb.e,pend)){box.innerHTML=`<div class="err">${T.nb_changed}</div>`;box.scrollIntoView({block:'center'});return}
      pend.push({cage:p.cage,fam:famKey,start:nb.s,end:nb.e,sizes:zs});
    }
    const fam=nb.client||Store.addFamily(nb.fname,nb.phone);
    const ids=nb.picked.slice(),mySvc=svcFor(sp),want={};
    mySvc.forEach(s=>{want[s.k]=new Set(nb.picked.filter(id=>nb.svcSaved[s.k][id]))});
    for(let i=0;i<nb.nNew;i++){const d=nb.news[i],id=Store.addPet(fam,sp,d);ids.push(id);mySvc.forEach(s=>{if(d.svc[s.k])want[s.k].add(id)})}
    nb.opt.parts.forEach(p=>{const mine=p.idx.map(i=>ids[i]),svc={};mySvc.forEach(s=>{svc[s.k]=mine.filter(id=>want[s.k].has(id))});Store.addBooking(fam,mine,p.cage,nb.s,nb.e,svc)});
    toast(T.saved_in(nb.opt.parts.map(p=>cname(p.cage)).join(' + ')));
    calStart=add(nb.s,-2);nb=freshNB();view='cal';render();window.scrollTo(0,0);
  }finally{saving=false}
}

/* one open problem: what it is, which day it is on, today's question, and the button that closes it */
function issueCard(i,d,b,back,inSheet){
  const red=issueRed(i),td=issueToday(i),lbl=CHK(),x=`data-i="${i.id}" data-back="${back||''}"${inSheet?' data-sheet="1"':''}`;

   <div class="imeta"><span class="chip ${red?'bad':'warn'}">${T.day_n(issueDay(i))}</span><span class="hint">${T.since(fmtAt(i.at))} · ${td?T.chk_today(lbl[td.status]):T.chk_none}</span></div>
   <div class="irow"><span class="flab">${T.chk_q}</span><div class="seg">${['same','better','worse'].map(k=>`<button type="button" data-act="icheck" data-s="${k}" ${x} aria-pressed="${!!td&&td.status===k}">${lbl[k]}</button>`).join('')}</div></div>
   <button class="btn sm fine" type="button" data-act="idone" ${x}>✓ ${T.all_fine}</button></div>`;

function obsRow(o,d,bk,open){
  let body;
  if(o.kind==='check')body=`<p>${T.log_check(CHK()[o.status]||'')}</p>`;
  else if(o.kind==='done')body=`<p>✓ ${T.log_done}</p>`;
  else{
    const chips=o.tags.map(k=>`<span class="chip warn">${T.obs_tags[k]||esc(k)}</span>`);
    if(o.kind==='problem'){if(issueDone(o))chips.push(`<span class="chip ok">${T.st_resolved}</span>`);else if(open.includes(o))chips.push(`<span class="chip plain">${T.st_follow}</span>`)}
    body=`${chips.length?`<div class="tags">${chips.join('')}</div>`:''}${o.text?`<p>${esc(o.text)}</p>`:''}`;
  }
  return `<div class="obs${o.kind==='check'||o.kind==='done'?' minor':''}"><div class="oh"><span class="hint">${fmtAt(o.at)}</span><button class="btn sm obsx" type="button" data-act="delobs" data-o="${o.id}" data-p="${d.id}" data-back="${bk}">${T.obs_del}</button></div>${body}</div>`;

   <h2 class="sech">${T.pets}</h2>
   <div class="list">${mine.map(p=>`<button class="item" data-act="pet" data-p="${p.id}" data-back="${back}"><span class="badges">${badges([p.size])}</span><span class="tx"><b>${esc(p.name)}</b><span>${petLine(p)}</span></span>${here(p)?`<span class="rt"><span class="chip ok">${T.st_in}</span></span>`:''}</button>`).join('')||`<div class="empty">${T.no_pets}</div>`}</div>
   <div class="actions" style="margin-top:8px"><button class="btn sm" type="button" data-act="newpet" data-f="${f.id}" data-sp="dog">${T.add_dog}</button><button class="btn sm" type="button" data-act="newpet" data-f="${f.id}" data-sp="cat">${T.add_cat}</button></div>
   <h2 class="sech">${T.recent_stays}</h2><div class="list">${stays.map(stayItem).join('')||`<div class="empty">${T.no_stays}</div>`}</div>`);
}
function saveClient(t){
  const name=$('#cf-name').value.trim(),phone=$('#cf-phone').value.trim();
  if(!name){$('#cf-err').innerHTML=`<div class="err">${T.e_fam}</div>`;$('#cf-name').focus();return}
  let id=t.dataset.f;
  if(id)Store.updateFamily(id,{name,phone});else id=Store.addFamily(name,phone);
  toast(T.client_saved);openClient(id);render();
}
function stayFor(id){
  closeSheet();nb=freshNB();nb.client=id;
  nb.picked=pets.filter(p=>p.fam===id&&p.species===sp).map(p=>p.id);nb.nNew=nb.picked.length?0:1;
  view='new';render();window.scrollTo(0,0);
}

/* ============================================================
   9. DRAG & DROP (calendar).  Touch: hold ~350 ms then drag.
   Mouse: drag straight away.  Drop on a cage row → validate.
   ============================================================ */
const drag={bar:null,b:null,ghost:null,tip:null,timer:null,x0:0,y0:0,active:false,ptr:null,over:null,moved:false};
function dragStart(e){
  const bar=drag.bar;const b=bookings.find(x=>x.id===bar.dataset.b);if(!b)return;
  drag.active=true;drag.b=b;document.body.classList.add('dragging');
  bar.classList.add('lift');
  const g=bar.cloneNode(true);g.classList.add('ghost');g.classList.remove('lift','cl','cr','half','l0','l1');g.style.left=e.clientX+'px';g.style.top=e.clientY+'px';g.style.width=Math.min(bar.offsetWidth,220)+'px';g.style.height='36px';g.style.fontSize='13px';
  document.body.appendChild(g);drag.ghost=g;
  const tip=document.createElement('div');tip.className='dragtip';tip.textContent=T.drag_hint;document.body.appendChild(tip);drag.tip=tip;
  if(navigator.vibrate)navigator.vibrate(15);
  dragOver(e);
}
function dragOver(e){
  if(!drag.active)return;
  drag.ghost.style.left=e.clientX+'px';drag.ghost.style.top=e.clientY+'px';
  const el=document.elementFromPoint(e.clientX,e.clientY);
  const row=el&&el.closest('.crow');
  const id=row?row.dataset.cage:null;
  if(id!==drag.over){
    document.querySelectorAll('.crow.drop-ok,.crow.drop-bad').forEach(r=>r.classList.remove('drop-ok','drop-bad'));
    drag.over=id;
    if(id){const r=canMove(drag.b,id);
      if(r==='m_same'){drag.tip.className='dragtip';drag.tip.textContent=T.drag_hint}
      else if(r){row.classList.add('drop-bad');drag.tip.className='dragtip bad';drag.tip.textContent=T[r]}
      else{row.classList.add('drop-ok');drag.tip.className='dragtip ok';drag.tip.textContent=T.drop_here(cname(id))}
    }else{drag.tip.className='dragtip';drag.tip.textContent=T.drag_hint}
  }
  /* auto-scroll the calendar when near its edges */
  const sc=$('#calScroll');if(sc){const r=sc.getBoundingClientRect();if(e.clientX<r.left+40)sc.scrollLeft-=8;else if(e.clientX>r.right-40)sc.scrollLeft+=8}
  if(e.clientY<110)window.scrollBy(0,-8);else if(e.clientY>innerHeight-110)window.scrollBy(0,8);
}
function dragEnd(commit){
  clearTimeout(drag.timer);
  if(drag.active){
    const target=drag.over,b=drag.b;
    document.querySelectorAll('.crow.drop-ok,.crow.drop-bad').forEach(r=>r.classList.remove('drop-ok','drop-bad'));
    drag.ghost&&drag.ghost.remove();drag.tip&&drag.tip.remove();
    document.body.classList.remove('dragging');
    drag.bar&&drag.bar.classList.remove('lift');
    drag.active=false;
    if(commit&&target&&target!==b.cage)doMove(b.id,target);
  }
  drag.bar=null;drag.b=null;drag.ghost=null;drag.tip=null;drag.over=null;drag.ptr=null;
}
document.addEventListener('pointerdown',e=>{
  const bar=e.target.closest('.bar');if(!bar||e.button>0)return;
  drag.bar=bar;drag.x0=e.clientX;drag.y0=e.clientY;drag.ptr=e.pointerId;drag.moved=false;
  if(e.pointerType==='mouse'){drag.timer=null}
  else{drag.timer=setTimeout(()=>{drag.timer=null;dragStart(e)},350)}
},{passive:true});
document.addEventListener('pointermove',e=>{
  if(!drag.bar||e.pointerId!==drag.ptr)return;
  const dx=Math.abs(e.clientX-drag.x0),dy=Math.abs(e.clientY-drag.y0);
  if(!drag.active){
    if(dx>8||dy>8){drag.moved=true;
      if(drag.timer){clearTimeout(drag.timer);drag.timer=null;drag.bar=null;return} /* touch: scrolled before hold ended → not a drag */
      dragStart(e);
    }
    return;
  }
  e.preventDefault();dragOver(e);
},{passive:false});
document.addEventListener('pointerup',e=>{if(drag.bar||drag.active){const was=drag.active;dragEnd(true);if(was)drag.suppressClick=true}});
document.addEventListener('pointercancel',()=>dragEnd(false));
document.addEventListener('contextmenu',e=>{if(e.target.closest('.bar'))e.preventDefault()});
document.addEventListener('touchmove',e=>{if(drag.active)e.preventDefault()},{passive:false});


/* ============================================================
   10. EVENTS
   ============================================================ */
document.addEventListener('click',e=>{
  if(drag.suppressClick){drag.suppressClick=false;e.preventDefault();return}
  const t=e.target.closest('[data-view],[data-act],[data-b],[data-lang]');if(!t)return;
  const D=t.dataset,a=D.act;
  if(D.lang){setLang(D.lang);return}
  if(D.view&&!a){syncForms();view=D.view;closeSheet();render();window.scrollTo(0,0);return}
  if(D.b&&!a){openStay(D.b);return}
  switch(a){
    case 'sp':setSp(D.sp);break;
    case 'big':document.body.classList.toggle('big');LS.set('ppt.big',document.body.classList.contains('big')?'1':'0');chrome();break;
    case 'goto':{const el=document.getElementById(D.to);if(el)el.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});break}
    case 'prev':calStart=add(calStart,-7);render();break;
    case 'next':calStart=add(calStart,7);render();break;
    case 'today':calStart=add(TODAY,-3);render();break;
    /* new stay */
    case 'nbn':nb.nNew=Number(D.n);render();break;
    case 'nbsize':nb.news[Number(D.i)].size=D.z;$$(`[data-act="nbsize"][data-i="${D.i}"]`).forEach(b=>b.setAttribute('aria-pressed',b.dataset.z===D.z));nbResults();break;
    case 'nbpick':nb.picked=nb.picked.includes(D.p)?nb.picked.filter(x=>x!==D.p):nb.picked.concat(D.p);render();break;
    case 'nbclient':nb.client=D.f;nb.q='';nb.picked=pets.filter(p=>p.fam===D.f&&p.species===sp).map(p=>p.id);nb.nNew=nb.picked.length?0:1;render();break;
    case 'nbclear':nb.client=null;nb.picked=[];nb.nNew=1;render();break;
    case 'nbbook':nb.opt=nb.opts[Number(D.o)];if(nb.opt){nb.step=2;render();window.scrollTo(0,0)}break;
    case 'nbback':syncDetails();nb.step=1;nb.opt=null;render();window.scrollTo(0,0);break;
    case 'nbsvc':{const on=D.v==='1',k=D.k;if(k[0]==='s')nb.svcSaved[D.s][k.slice(2)]=on;else nb.news[Number(k.slice(2))].svc[D.s]=on;
      [...t.parentElement.children].forEach(b=>b.setAttribute('aria-pressed',b===t));break}
    case 'nbsave':nbSave();break;
    /* clients, pets */
    case 'client':openClient(D.f,D.mode==='edit');break;
    case 'newclient':openClient(null,true);break;
    case 'saveclient':saveClient(t);break;
    case 'stayfor':stayFor(D.f);break;
    case 'newpet':{const f=famById(D.f);sheet(T.new_pet[D.sp],head(T.new_pet[D.sp],esc(f.name),'c:'+f.id)+petForm(null,f.id,D.sp,'c:'+f.id));$('#pf-name').focus();break}
    case 'pet':openPet(D.p,D.back||'',D.mode==='edit');break;
    case 'savepet':savePet(t);break;
    case 'back':goBack(D.to);break;
    case 'close':closeSheet();break;
    /* stays */
    case 'editstay':openStay(D.b2,true);break;
    case 'savestay':saveStay(D.b2);break;
    case 'domove':{const sel=$('#mv');if(sel&&doMove(D.b2,sel.value))openStay(D.b2);break}
    case 'svc':{const on=D.v==='1',d=petById(D.p);Store.setSvc(D.b2,D.s,D.p,on);toast((on?T.svc_on:T.svc_off)(T[D.s],d?d.name:''));openStay(D.b2);render();break}
    case 'askcancel':$('#cx').innerHTML=`<span>${T.cancel_q}</span><button class="btn danger fill sm" type="button" data-act="docancel" data-b2="${D.b2}">${T.yes_cancel}</button><button class="btn sm" type="button" data-act="nocancel" data-b2="${D.b2}">${T.no}</button>`;break;
    case 'nocancel':openStay(D.b2);break;
    case 'docancel':Store.deleteBooking(D.b2);closeSheet();render();toast(T.cancelled);break;
    /* observations */
    case 'obstag':t.setAttribute('aria-pressed',String(t.getAttribute('aria-pressed')!=='true'));break;
    case 'addobs':{
      const tags=$$('.sheet [data-act="obstag"][aria-pressed="true"]').map(x=>x.dataset.k),text=($('#obs-text').value||'').trim();
      if(!tags.length&&!text){toast(T.obs_need,true);break}
      const fo=$('#obs-follow');
      Store.addObs(D.p,tags,text,{kind:fo&&fo.checked?'problem':'note'});toast(T.obs_saved);openPet(D.p,D.back);render();break}
    case 'icheck':case 'idone':{
      const i=observations.find(o=>o.id===D.i);if(!i)break;
      if(a==='icheck'){Store.checkIssue(i,D.s);toast(T.chk_saved)}else{Store.closeIssue(i);toast(T.issue_closed)}
      if(D.sheet)openPet(i.dog,D.back||'');render();break}
    case 'delobs':t.textContent=T.obs_del2;t.classList.add('danger');D.act='delobs2';break;
    case 'delobs2':Store.deleteObs(D.o);toast(T.obs_deleted);openPet(D.p,D.back);render();break;
    /* account */
    case 'login':{
      const em=$('#li-email').value.trim(),pw=$('#li-pass').value,box=$('#li-err');box.innerHTML='';t.disabled=true;
      Remote.signIn(em,pw).then(async s=>{Store.user=(s&&s.user&&s.user.email)||em;authing=false;document.body.classList.remove('authing');await Store.load();startSync();render()})
        .catch(err=>{console.error(err);t.disabled=false;box.innerHTML=`<div class="err">${T.login_bad}</div>`});break}
    case 'logout':Promise.resolve(Remote.signOut()).catch(()=>{}).then(()=>location.reload());break;
    case 'retry':location.reload();break;
  }
});
document.addEventListener('input',e=>{
  const id=e.target.id||'';
  if(id==='nb-q'){nb.q=e.target.value;nbClientList()}
  if(id==='cl-q'){cq=e.target.value;clientList()}
  if(id==='nb-s'||id==='nb-e'){nb.s=$('#nb-s').value;nb.e=$('#nb-e').value;nbResults()}
  const m=id.match(/^nb-b(\d)$/);
  if(m){const d=nb.news[Number(m[1])];d.breed=breedKey(e.target.value);const x=breedFind(e.target.value);
    if(x&&x[2]!==d.size){d.size=x[2];$$(`[data-act="nbsize"][data-i="${m[1]}"]`).forEach(b=>b.setAttribute('aria-pressed',b.dataset.z===d.size));nbResults()}}
  if(id==='pf-breed'){const x=breedFind(e.target.value),s=$('#pf-size');if(x&&s)s.value=x[2]}
});
document.addEventListener('change',e=>{const id=e.target.id||'';if(id==='nb-s'||id==='nb-e'){nb.s=$('#nb-s').value;nb.e=$('#nb-e').value;nbResults()}});
/* nothing submits natively (some embedded previews block forms): buttons and Enter are handled here */
document.addEventListener('submit',e=>e.preventDefault());
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeSheet();return}
  if(e.key!=='Enter'||e.target.tagName!=='INPUT')return;
  if(e.target.id==='obs-text'){e.preventDefault();$('.sheet [data-act="addobs"]').click();return}
  const box=e.target.closest('[data-enter]');if(!box)return;
  e.preventDefault();e.target.blur();box.querySelector(box.dataset.enter).click();
});

/* ============================================================
   11. START
   ============================================================ */
let syncOn=false;
function startSync(){
  if(syncOn||DB===Local)return;syncOn=true;
  const tick=async()=>{if(document.hidden||saving||authing)return;await Store.refresh();softRender()};
  setInterval(tick,30000);
  document.addEventListener('visibilitychange',tick);
}
async function boot(){
  document.documentElement.lang=lang;
  if(LS.get('ppt.big')==='1')document.body.classList.add('big');
  if(location.search.includes('reset')){LS.del(Local.KEY);try{history.replaceState(null,'',location.pathname+location.hash)}catch(e){}}
  chrome();
  if(SUPABASE.url&&SUPABASE.anonKey){
    try{
      await Remote.init();DB=Remote;
      const s=await Remote.session();
      if(!s){authing=true;document.body.classList.add('authing');render();return}
      Store.user=(s.user&&s.user.email)||'';
      await Store.load();startSync();
    }catch(e){
      console.error(e);document.body.classList.add('authing');
      main.innerHTML=`<div class="no"><b>${T.db_down}</b><br>${esc(e.message||e)}</div><div class="actions"><button class="btn blue" type="button" data-act="retry">${T.retry}</button></div>`;
      return;
    }
  }else{await Store.load()}
  render();
}
boot();
</script>
