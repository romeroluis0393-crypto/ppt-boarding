/* ============================================================
   Premier Pet Travel · Boarding
   App shell: sticky top bar · one view at a time · fixed bottom tabs.
   Calendar = timeline, one row per cage, one column per night.
   ============================================================ */
:root{
  --bg:#EEF4FA; --surface:#FFFFFF; --ink:#1E2F45; --muted:#5F7390; --line:#D3E0EE;
  --accent:#3E6DB3; --accent-soft:#DCEBF8; --on-accent:#FFFFFF;
  --bar:#3E6DB3; --bar-ink:#FFFFFF; --res:#E9F0F8;
  --warn:#D97A2A; --warn-soft:#FDEBDD; --danger:#B3261E; --danger-soft:#FBE4E2;
  --ok:#2E7D5B; --ok-soft:#DCF2E7;
  --sP:#F0924A; --sM:#3E6DB3; --sG:#6B5CB8; --sXG:#B8436A;
  --scrim:rgba(14,30,50,.5);
  --font:'Nunito',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --cw:46px; --lw:96px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101925; --surface:#182435; --ink:#E6EEF8; --muted:#95A8C2; --line:#2A3B52;
  --accent:#7FB0E8; --accent-soft:#1E3550; --on-accent:#0B1626;
  --bar:#4F84C9; --bar-ink:#FFFFFF; --res:#1F2D40;
  --warn:#F0A05F; --warn-soft:#3E2A18; --danger:#F08A82; --danger-soft:#3C1F1D;
  --ok:#6FD0A4; --ok-soft:#1C3A2D;
  --sP:#F0A05F; --sM:#7FB0E8; --sG:#B39CE8; --sXG:#E77FA2;
  --scrim:rgba(0,0,0,.6); color-scheme:dark;}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
body.dragging{user-select:none;-webkit-user-select:none;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
img{max-width:100%}
[hidden]{display:none!important}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:3px solid var(--accent-soft);
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:10px;
  display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;letter-spacing:-.01em;line-height:1.1;color:var(--accent);min-width:0}
.brand img{width:40px;height:40px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 0 2px var(--accent-soft)}
.brand small{display:block;font-weight:600;font-size:12px;color:var(--muted);letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topr{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.hdate{font-size:13px;color:var(--muted);white-space:nowrap;font-weight:600}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{font:inherit;font-size:12px;font-weight:800;padding:6px 9px;border:0;background:var(--surface);color:var(--muted);cursor:pointer;min-height:32px}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.wrap{padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:16px calc(96px + env(safe-area-inset-bottom,0px))}
main{max-width:980px;margin:0 auto}
h1{font-weight:800;font-size:24px;letter-spacing:-.02em;margin:0 0 2px;text-wrap:balance;line-height:1.15;color:var(--accent)}
h2{font-weight:800;font-size:17px;margin:22px 0 8px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 14px;font-size:14px}
.btn{font:inherit;font-weight:700;border-radius:999px;padding:10px 16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;min-height:44px;touch-action:manipulation}
.btn.sm{padding:6px 12px;min-height:38px}
.btn.primary{background:var(--warn);border-color:var(--warn);color:#fff;text-transform:uppercase;letter-spacing:.04em;font-size:13px}
.btn.blue{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.danger.fill{background:var(--danger);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:700;white-space:nowrap}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.plain{background:var(--res);color:var(--muted)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.sz{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font-size:10px;font-weight:800;color:#fff;flex:0 0 auto;letter-spacing:-.02em}
.sz.P{background:var(--sP)}.sz.M{background:var(--sM)}.sz.G{background:var(--sG)}.sz.XG{background:var(--sXG)}
.hint{font-size:12px;color:var(--muted)}

/* ---- calendar ---- */
.cal-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.navbtns{display:flex;gap:6px}
.legend{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 0 10px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend .sw{width:22px;height:12px;border-radius:999px;background:var(--bar)}
.legend .sw.e{background:var(--warn-soft);box-shadow:inset 0 0 0 2px var(--warn)}
.cal-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface);-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.cal{position:relative;width:max-content}
.row{display:flex;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.lab{position:sticky;left:0;z-index:4;width:var(--lw);flex:0 0 var(--lw);background:var(--surface);border-right:1px solid var(--line);padding:4px 8px;display:flex;flex-direction:column;justify-content:center;font-size:13px;line-height:1.2}
.lab b{font-weight:800}
.lab small{color:var(--muted);font-size:11px}
.track{position:relative;flex:0 0 auto;background-image:repeating-linear-gradient(to right,transparent 0 calc(var(--cw) - 1px),var(--line) calc(var(--cw) - 1px) var(--cw))}
.crow{height:54px}
.crow.res .track{background-color:var(--res)}
.crow.drop-ok .track{background-color:var(--ok-soft);box-shadow:inset 0 0 0 2px var(--ok)}
.crow.drop-ok .lab{background:var(--ok-soft)}
.crow.drop-bad .track{background-color:var(--danger-soft);box-shadow:inset 0 0 0 2px var(--danger)}
.crow.drop-bad .lab{background:var(--danger-soft)}
.hrow{height:56px}.hrow .track{display:flex;background:none}
.dc{width:var(--cw);flex:0 0 var(--cw);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-variant-numeric:tabular-nums}
.dc small{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.dc b{font-size:14px;width:28px;height:28px;display:grid;place-items:center;border-radius:50%}
.dc.today b{background:var(--accent);color:var(--on-accent)}
.dc.we small{color:var(--accent)}
.frow{height:30px}.frow .track{display:flex;background:none}
.fc{width:var(--cw);flex:0 0 var(--cw);display:grid;place-items:center;font-size:12px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent)}
.fc.low{color:var(--warn)}.fc.zero{color:var(--danger)}
.zrow{height:28px;background:var(--bg)}
.zrow .lab{background:var(--bg);flex-direction:row;align-items:center;justify-content:flex-start;width:auto;flex:0 0 auto;border-right:0;white-space:nowrap;gap:6px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:800}
.zrow .lab em{font-style:normal;text-transform:none;letter-spacing:0;font-weight:400}
.tcol{position:absolute;top:0;bottom:0;width:var(--cw);background:var(--accent-soft);opacity:.55;pointer-events:none}
.bar{position:absolute;top:9px;height:36px;border-radius:999px;background:var(--bar);color:var(--bar-ink);border:0;display:flex;align-items:center;gap:4px;padding:0 10px 0 7px;font:inherit;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;cursor:grab;text-align:left;z-index:2;touch-action:pan-x pan-y}
.bar.cl{border-top-left-radius:0;border-bottom-left-radius:0}
.bar.cr{border-top-right-radius:0;border-bottom-right-radius:0}
.bar.emg{background:var(--warn-soft);color:var(--ink);box-shadow:inset 0 0 0 2px var(--warn)}
.bar.half{height:19px;font-size:11px;top:6px}.bar.half.l1{top:29px}
.bar.half .sz{width:15px;height:15px;font-size:8px}
.bar .nm{overflow:hidden;text-overflow:ellipsis;margin-left:3px}
.bar .sz{box-shadow:0 0 0 1.5px rgba(255,255,255,.9)}
.bar.lift{opacity:.35}
.ghost{position:fixed;z-index:60;pointer-events:none;opacity:.92;box-shadow:0 10px 28px rgba(0,0,0,.28);transform:translate(-50%,-50%) scale(1.04);cursor:grabbing}
.ghost .sz{box-shadow:0 0 0 1.5px rgba(255,255,255,.9)}
.dragtip{position:fixed;left:50%;transform:translateX(-50%);top:calc(70px + env(safe-area-inset-top,0px));z-index:61;background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;font-weight:700;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.dragtip.ok{background:var(--ok);color:#fff}.dragtip.bad{background:var(--danger);color:#fff}

/* ---- lists & stats ---- */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:680px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat .n{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1;color:var(--accent)}
.stat .t{color:var(--muted);font-size:13px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;width:100%;text-align:left;font:inherit;color:inherit;min-height:56px}
.item .badges{display:flex;gap:2px;flex:0 0 auto}
.item .badges .sz{box-shadow:0 0 0 1.5px var(--surface)}
.item .tx{flex:1;min-width:0}
.item .tx b{display:block;color:var(--accent)}
.item .tx span{color:var(--muted);font-size:13px}
.item .rt{flex:0 0 auto;text-align:right;font-size:13px}
.empty{color:var(--muted);font-size:14px;padding:12px;border:1px dashed var(--line);border-radius:12px}
.alert{display:flex;gap:10px;align-items:flex-start;background:var(--warn-soft);border-radius:12px;padding:10px 12px;font-size:14px}
.alert b{color:var(--warn)}

/* ---- forms ---- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.flab{font-size:13px;font-weight:700}
input,select,textarea{font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);width:100%;min-width:0;min-height:44px}
textarea{resize:vertical;min-height:48px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:40px;touch-action:manipulation}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.seg button[aria-pressed="true"] .sz{box-shadow:0 0 0 1.5px rgba(255,255,255,.9)}
.dogblock{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.dogblock h3{margin:0;font-size:16px;font-weight:800}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.opt{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.opt.w{border-color:var(--warn)}
.opt .r1{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.opt .cg{font-size:18px;font-weight:800}
.opt p{margin:0;font-size:13px;color:var(--muted)}
.opt .r2{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.err{color:var(--danger);background:var(--danger-soft);padding:10px 12px;border-radius:10px;font-size:14px}
.no{background:var(--danger-soft);color:var(--danger);border-radius:12px;padding:12px 14px;font-size:14px}
.okbox{background:var(--ok-soft);color:var(--ok);border-radius:12px;padding:12px 14px;font-size:14px}

/* ---- tabs ---- */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tab{background:none;border:0;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font:inherit;font-size:12px;font-weight:600;cursor:pointer;min-height:56px;touch-action:manipulation}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent);font-weight:800}

/* ---- sheets ---- */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:18px 18px 0 0;max-height:88%;overflow:auto;max-width:640px;margin:0 auto;
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:10px calc(22px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out;-webkit-overflow-scrolling:touch}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sheet h2{margin:0 0 2px;font-size:22px;color:var(--accent)}
.shead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:12px 0}
.kv dt{color:var(--muted)}.kv dd{margin:0;min-width:0}
.dogcard{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:8px;width:100%;text-align:left;font:inherit;color:inherit;background:var(--surface);cursor:pointer}
.dogcard .hd{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.dogcard .hd b{font-size:16px}
.dogcard .hd .go{margin-left:auto;color:var(--accent);font-weight:800;font-size:13px}
.dogcard dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:14px}
.dogcard dt{color:var(--muted)}.dogcard dd{margin:0}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;align-items:center}
.moverow{display:flex;gap:8px;align-items:center;margin-top:14px;flex-wrap:wrap}
.moverow select{flex:1;min-width:160px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--accent);color:#fff;padding:10px 16px;border-radius:999px;font-weight:700;font-size:14px;z-index:70;max-width:calc(100% - 32px);text-align:center}
.toast.bad{background:var(--danger)}
.syncdot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.syncdot.local{background:var(--muted)}
</style>
</head>

/* ============================================================
   5. CAGE LOGIC
   ============================================================ */
const bSizes=b=>b.sizes||b.dogs.map(id=>dogById(id).size);
const covers=(b,d)=>b.start<=d&&d<b.end;
/* returns null if the dogs fit in cage c for [s,e), otherwise a reason key */
function why(c,sizes,fam,s,e,pending=[],exclude=null){
  const n=sizes.length;
  if(n>c.max)return 'm_full';
  if(!sizes.every(z=>c.sizes.includes(z)))return 'm_size';
  if(n>1&&!sizes.every(z=>c.pair.includes(z)))return 'm_pair';
  const all=bookings.filter(b=>b.id!==exclude).concat(pending);
  for(let d=s;d<e;d=add(d,1)){
    const here=all.filter(b=>b.cage===c.id&&covers(b,d));
    if(here.length){
      if(here.some(b=>b.fam!==fam))return 'm_family';
      const zs=here.flatMap(b=>bSizes(b)).concat(sizes);
      if(zs.length>c.max)return 'm_full';
      if(!zs.every(z=>c.pair.includes(z)))return 'm_pair';
    }else if(c.res){
      const used=new Set(all.filter(b=>CAGE[b.cage].res&&covers(b,d)).map(b=>b.cage));
      if(used.size>=2)return 'm_rec1';
    }
  }
  return null;
}
const fits=(c,sizes,fam,s,e,pending=[])=>why(c,sizes,fam,s,e,pending)===null;
function canMove(b,cageId){
  if(cageId===b.cage)return 'm_same';
  return why(CAGE[cageId],bSizes(b),b.fam,b.start,b.end,[],b.id);
}
function score(c,sizes){
  const big=sizes.some(z=>z!=='P');
  let p=0;
  if(c.zone==='small')p=big?1:0;
  if(c.zone==='wood')p=big?0:1;
  if(sizes.length===1&&c.max>1)p+=.5;
  return c.tier*10+p;
}
/* 3+ dogs: try every way of splitting them into groups of 1 or 2 and give each group the best cage that fits */
const RANK={P:0,M:1,G:2,XG:3};
function partitions(n){
  const res=[];
  (function rec(rest,acc){
    if(!rest.length){res.push(acc);return}
    const a=rest[0],r=rest.slice(1);
    rec(r,acc.concat([[a]]));
    r.forEach((b,j)=>rec(r.filter((_,k)=>k!==j),acc.concat([[a,b]])));
  })([...Array(n).keys()],[]);
  return res;
}
function suggestMany(sizes,fam,s,e){
  const out=[],seen=new Set();
  const big=g=>Math.max(...g.map(k=>RANK[sizes[k]]));
  for(const part of partitions(sizes.length)){
    const groups=part.slice().sort((a,b)=>b.length-a.length||big(b)-big(a));
    let nodes=0;
    const dfs=(gi,pend,used,acc)=>{
      if(gi===groups.length)return acc;
      const g=groups[gi],zs=g.map(k=>sizes[k]);
      const cands=CAGES.filter(c=>!used.has(c.id)&&fits(c,zs,fam,s,e,pend)).sort((a,b)=>score(a,zs)-score(b,zs));
      for(const c of cands){
        if(++nodes>300)return null;
        const r=dfs(gi+1,pend.concat([{cage:c.id,fam,start:s,end:e,sizes:zs}]),new Set(used).add(c.id),
          acc.concat([{cage:c.id,idx:g,tier:c.tier,sc:score(c,zs)-(g.length>1?.2:0)}]));
        if(r)return r;
      }
      return null;
    };
    const sol=dfs(0,[],new Set(),[]);
    if(!sol)continue;
    const key=sol.map(p=>p.cage+':'+p.idx.map(k=>sizes[k]).sort().join('')).sort().join('|');
    if(seen.has(key))continue;seen.add(key);
    sol.sort((a,b)=>a.idx[0]-b.idx[0]);
    out.push({parts:sol.map(p=>({cage:p.cage,idx:p.idx})),tier:Math.max(...sol.map(p=>p.tier)),shared:sol.some(p=>p.idx.length>1),
      score:Math.max(...sol.map(p=>p.sc))+.1*(sol.length-1)+.001*sol.reduce((a,p)=>a+p.sc,0)});
  }
  return out.sort((x,y)=>x.score-y.score).slice(0,6);
}
function suggest(sizes,fam,s,e){
  if(sizes.length>2)return suggestMany(sizes,fam,s,e);
  const out=[];
  const single=(z,pend)=>CAGES.filter(c=>fits(c,[z],fam,s,e,pend)).sort((a,b)=>score(a,[z])-score(b,[z]));
  if(sizes.length===1){
    single(sizes[0],[]).forEach(c=>out.push({parts:[{cage:c.id,idx:[0]}],tier:c.tier,score:score(c,sizes)}));
  }else{
    CAGES.filter(c=>fits(c,sizes,fam,s,e)).forEach(c=>out.push({parts:[{cage:c.id,idx:[0,1]}],tier:c.tier,score:score(c,sizes)-.2,shared:true}));
    const a=single(sizes[0],[])[0];
    if(a){
      const pend=[{cage:a.id,fam,start:s,end:e,sizes:[sizes[0]]}];
      const b=single(sizes[1],pend).filter(c=>c.id!==a.id)[0];
      if(b)out.push({parts:[{cage:a.id,idx:[0]},{cage:b.id,idx:[1]}],tier:Math.max(a.tier,b.tier),score:Math.max(score(a,[sizes[0]]),score(b,[sizes[1]]))+.1});
    }
  }
  return out.sort((x,y)=>x.score-y.score).slice(0,6);
}
function freeCount(d){
  let n=0;const r1=new Set();
  CAGES.forEach(c=>{
    const occ=bookings.some(b=>b.cage===c.id&&covers(b,d));
    if(c.res){if(occ)r1.add(c.id)}else if(!occ)n++;
  });
  return n+Math.max(0,2-r1.size);
}

function viewCal(){
  const end=add(calStart,DAYS-1);
  const a=parse(calStart),b=parse(end);
  const ml=a.getUTCMonth()===b.getUTCMonth()?`${T.monl[a.getUTCMonth()]} ${a.getUTCFullYear()}`:`${T.monl[a.getUTCMonth()]} – ${T.monl[b.getUTCMonth()]}`;
  const W=`calc(var(--cw) * ${DAYS})`;
  const ti=diff(calStart,TODAY);
  const tcol=(ti>=0&&ti<DAYS)?`<div class="tcol" style="left:calc(var(--cw) * ${ti})"></div>`:'';
  let h=`<div class="cal-head"><div><h1>${cap(ml)}</h1><p class="sub" style="margin:0">${T.cal_tap}</p></div>
  <div class="navbtns"><button class="btn sm" data-act="prev" aria-label="${T.prev}">‹</button><button class="btn sm" data-act="today">${T.today}</button><button class="btn sm" data-act="next" aria-label="${T.next}">›</button></div></div>
  <div class="legend"><span><i class="sw"></i>${T.lg_stay}</span><span><i class="sw e"></i>${T.lg_emg}</span><span>${badges(['P','M','G','XG'])} ${T.lg_size}</span></div>
  <div class="cal-scroll" id="calScroll"><div class="cal">`;
  let days='',free='';
  for(let i=0;i<DAYS;i++){
    const d=add(calStart,i),dt=parse(d),wd=dt.getUTCDay();
    days+=`<div class="dc${d===TODAY?' today':''}${wd===0||wd===6?' we':''}"><small>${T.wd[wd].slice(0,2)}</small><b>${dt.getUTCDate()}</b></div>`;
    const f=freeCount(d);
    free+=`<div class="fc${f===0?' zero':f<=3?' low':''}">${f}</div>`;
  }
  h+=`<div class="row hrow"><div class="lab"><small>${T.cage}</small></div><div class="track" style="width:${W}">${days}</div></div>`;
  h+=`<div class="row frow"><div class="lab"><small>${T.free}</small></div><div class="track" style="width:${W}">${free}</div></div>`;
  ZONES.forEach(z=>{
    const note=z==='rec1'?T.z_rec1_note:z==='large'?T.z_large_note:'';
    h+=`<div class="row zrow"><div class="lab">${T['z_'+z]}${note?` <em>· ${note}</em>`:''}</div></div>`;
    CAGES.filter(c=>c.zone===z).forEach(c=>{
      h+=`<div class="row crow${c.res?' res':''}" data-cage="${c.id}"><div class="lab"><b>${cname(c)}</b><small>${chint(c)}</small></div><div class="track" style="width:${W}">${tcol}${cageBars(c)}</div></div>`;
    });
  });
  h+=`</div></div>`;
  return h;
}
function cageBars(c){
  const rEnd=add(calStart,DAYS);
  const bs=bookings.filter(b=>b.cage===c.id&&b.start<rEnd&&b.end>calStart).sort((a,b)=>a.start<b.start?-1:1);
  const lanes=[];bs.forEach(b=>{let l=lanes.findIndex(e=>e<=b.start);if(l<0){l=lanes.length;lanes.push(b.end)}else lanes[l]=b.end;b._l=l});
  const half=lanes.length>1;
  return bs.map(b=>{
    const x0=diff(calStart,b.start)+.5,x1=diff(calStart,b.end)+.5;
    const L=Math.max(x0,0),R=Math.min(x1,DAYS);
    if(R<=L)return'';
    const cls=['bar'];if(x0<0)cls.push('cl');if(x1>DAYS)cls.push('cr');if(isEmg(b))cls.push('emg');if(half)cls.push('half','l'+b._l);
    const narrow=(R-L)<1.6;
    return `<button class="${cls.join(' ')}" data-b="${b.id}" style="left:calc(var(--cw) * ${L});width:calc(var(--cw) * ${R-L})" aria-label="${esc(names(b))}, ${fmt(b.start)} – ${fmt(b.end)}">${badges(bSizes(b))}${narrow?'':`<span class="nm">${esc(names(b))}</span>`}</button>`;
  }).join('');
}

function viewToday(){
  const stay=bookings.filter(b=>covers(b,TODAY));
  const ins=bookings.filter(b=>b.start===TODAY),outs=bookings.filter(b=>b.end===TODAY);
  const nDogs=stay.reduce((a,b)=>a+b.dogs.length,0)+LUCY.length;
  const meds=stay.flatMap(b=>b.dogs.map(id=>({b,d:dogById(id)}))).filter(x=>x.d.meds);
  const emg=stay.filter(isEmg);
  let h=`<h1>${cap(fmtLong(TODAY))}</h1><p class="sub">${T.today_sub}</p>
  <div class="stats">
   <div class="stat"><div class="n">${nDogs}</div><div class="t">${T.dogs_tonight}<br><span class="hint">${T.incl_lucy(LUCY.length)}</span></div></div>
   <div class="stat"><div class="n">${freeCount(TODAY)}</div><div class="t">${T.free_tonight}</div></div>
   <div class="stat"><div class="n">${ins.reduce((a,b)=>a+b.dogs.length,0)}</div><div class="t">${T.arriving}</div></div>
   <div class="stat"><div class="n">${outs.reduce((a,b)=>a+b.dogs.length,0)}</div><div class="t">${T.leaving}</div></div>
  </div>`;
  if(meds.length||emg.length){
    h+=`<h2>${T.attention}</h2><div class="list">`;
    meds.forEach(x=>h+=`<button class="alert item" data-dog="${x.d.id}" style="background:var(--warn-soft)"><b>💊</b><span><b>${esc(x.d.name)}</b> (${cname(x.b.cage)}): ${esc(x.d.meds)}</span></button>`);
    emg.forEach(b=>h+=`<div class="alert"><b>!</b><span>${CAGE[b.cage].res?T.emg_rec1(`<b>${esc(names(b))}</b>`,b.cage):T.emg_large(`<b>${esc(names(b))}</b>`,cname(b.cage))}</span></div>`);
    h+=`</div>`;
  }
  h+=`<h2>${T.arriving}</h2>`+(ins.length?`<div class="list">${ins.map(b=>item(b)).join('')}</div>`:`<div class="empty">${T.nobody_in}</div>`);

  h+=`<h2>${T.staying}</h2><div class="list">${stay.filter(b=>b.start!==TODAY).map(b=>item(b,T.leaves(fmt(b.end)))).join('')}</div>`;
  return h;
}

function optHTML(o,i,dogNames,withBtn){

  }else{
    body=`<dl class="kv"><dt>${T.breed}</dt><dd>${esc(breedLabel(d.breed))||'—'}</dd>
     <dt>${T.size}</dt><dd>${badges([d.size])} ${T.sizes[d.size]}</dd>
     <dt>${T.owner}</dt><dd>${esc(f.name)}</dd>
     <dt>${T.meds}</dt><dd>${d.meds?`<b style="color:var(--warn)">💊 ${esc(d.meds)}</b>`:T.none}</dd>
     <dt>${T.food}</dt><dd>${esc(d.food)||'—'}</dd>
     <dt>${T.notes}</dt><dd>${esc(d.notes)||'—'}</dd></dl>
     <h2 style="font-size:16px;color:var(--ink);margin-top:8px">${T.stays}</h2><div class="list">${stays.map(b=>{const st=b.end<=TODAY?'st_done':b.start>TODAY?'st_next':'st_in';return `<button class="item" data-b="${b.id}"><span class="tx"><b>${fmt(b.start)} → ${fmt(b.end)}</b><span>${diff(b.start,b.end)} ${diff(b.start,b.end)===1?T.night:T.nights}</span></span><span class="rt"><span class="chip${st==='st_in'?' ok':' plain'}">${T[st]}</span><br><span class="hint">${cname(b.cage)}</span></span></button>`}).join('')||`<div class="empty">—</div>`}</div>
     <div class="actions"><button class="btn blue" data-act="editdog" data-dog="${d.id}" data-from="${from||''}">${T.edit}</button></div>`;
  }
  $('#sheetRoot').innerHTML=`<div class="scrim" data-act="close"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(d.name)}">
   <div class="grab"></div>
   <div class="shead"><div>${from?`<button class="btn sm" data-b="${from}" style="margin-bottom:6px">${T.back}</button><br>`:''}<h2>${badges([d.size])} ${esc(d.name)}</h2><span class="hint">${esc(f.name)}</span></div><button class="btn sm" data-act="close">${T.close}</button></div>${body}</div>`;
  if(edit)$('#df-name').focus();
}
function saveDog(){
  const v=id=>($('#'+id)||{}).value||'';
  const id=document.querySelector('.sheet [data-act="opendog"]').dataset.dog,from=document.querySelector('.sheet [data-act="opendog"]').dataset.from;
  const name=v('df-name').trim();if(!name)return;
  Store.updateDog(id,{name,breed:breedKey(v('df-breed')),size:v('df-size'),food:v('df-food').trim(),meds:v('df-meds').trim(),notes:v('df-notes').trim()});
  toast(T.dog_saved);openDog(id,from);render();
}
function closeSheet(){$('#sheetRoot').innerHTML=''}
function doMove(id,cage){
  const b=bookings.find(x=>x.id===id);if(!b)return false;
  const r=canMove(b,cage);
  if(r){toast(T[r],true);return false}
  Store.moveBooking(id,cage);
  toast(T.moved(cname(cage)));
  render();return true;
}

/* ============================================================
   9. DRAG & DROP (calendar).  Touch: hold ~350 ms then drag.
   Mouse: drag straight away.  Drop on a cage row → validate.
   ============================================================ */
const drag={bar:null,b:null,ghost:null,tip:null,timer:null,x0:0,y0:0,active:false,ptr:null,over:null,moved:false};
function dragStart(e){
  const bar=drag.bar;const b=bookings.find(x=>x.id===bar.dataset.b);if(!b)return;
  drag.active=true;drag.b=b;document.body.classList.add('dragging');
  bar.classList.add('lift');
  const g=bar.cloneNode(true);g.classList.add('ghost');g.classList.remove('lift','cl','cr','half','l0','l1');g.style.left=e.clientX+'px';g.style.top=e.clientY+'px';g.style.width=Math.min(bar.offsetWidth,220)+'px';g.style.height='36px';g.style.fontSize='13px';
  document.body.appendChild(g);drag.ghost=g;
  const tip=document.createElement('div');tip.className='dragtip';tip.textContent=T.drag_hint;document.body.appendChild(tip);drag.tip=tip;
  if(navigator.vibrate)navigator.vibrate(15);
  dragOver(e);
}
function dragOver(e){
  if(!drag.active)return;
  drag.ghost.style.left=e.clientX+'px';drag.ghost.style.top=e.clientY+'px';
  const el=document.elementFromPoint(e.clientX,e.clientY);
  const row=el&&el.closest('.crow');
  const id=row?row.dataset.cage:null;
  if(id!==drag.over){
    document.querySelectorAll('.crow.drop-ok,.crow.drop-bad').forEach(r=>r.classList.remove('drop-ok','drop-bad'));
    drag.over=id;
    if(id){const r=canMove(drag.b,id);
      if(r==='m_same'){drag.tip.className='dragtip';drag.tip.textContent=T.drag_hint}
      else if(r){row.classList.add('drop-bad');drag.tip.className='dragtip bad';drag.tip.textContent=T[r]}
      else{row.classList.add('drop-ok');drag.tip.className='dragtip ok';drag.tip.textContent=T.drop_here(cname(id))}
    }else{drag.tip.className='dragtip';drag.tip.textContent=T.drag_hint}
  }
  /* auto-scroll the calendar when near its edges */
  const sc=$('#calScroll');if(sc){const r=sc.getBoundingClientRect();if(e.clientX<r.left+40)sc.scrollLeft-=8;else if(e.clientX>r.right-40)sc.scrollLeft+=8}
  if(e.clientY<110)window.scrollBy(0,-8);else if(e.clientY>innerHeight-110)window.scrollBy(0,8);
}
function dragEnd(commit){
  clearTimeout(drag.timer);
  if(drag.active){
    const target=drag.over,b=drag.b;
    document.querySelectorAll('.crow.drop-ok,.crow.drop-bad').forEach(r=>r.classList.remove('drop-ok','drop-bad'));
    drag.ghost&&drag.ghost.remove();drag.tip&&drag.tip.remove();
    document.body.classList.remove('dragging');
    drag.bar&&drag.bar.classList.remove('lift');
    drag.active=false;
    if(commit&&target&&target!==b.cage)doMove(b.id,target);
  }
  drag.bar=null;drag.b=null;drag.ghost=null;drag.tip=null;drag.over=null;drag.ptr=null;
}
document.addEventListener('pointerdown',e=>{
  const bar=e.target.closest('.bar');if(!bar||e.button>0)return;
  drag.bar=bar;drag.x0=e.clientX;drag.y0=e.clientY;drag.ptr=e.pointerId;drag.moved=false;
  if(e.pointerType==='mouse'){drag.timer=null}
  else{drag.timer=setTimeout(()=>{drag.timer=null;dragStart(e)},350)}
},{passive:true});
document.addEventListener('pointermove',e=>{
  if(!drag.bar||e.pointerId!==drag.ptr)return;
  const dx=Math.abs(e.clientX-drag.x0),dy=Math.abs(e.clientY-drag.y0);
  if(!drag.active){
    if(dx>8||dy>8){drag.moved=true;
      if(drag.timer){clearTimeout(drag.timer);drag.timer=null;drag.bar=null;return} /* touch: scrolled before hold ended → not a drag */
      dragStart(e);
    }
    return;
  }
  e.preventDefault();dragOver(e);
},{passive:false});
document.addEventListener('pointerup',e=>{if(drag.bar||drag.active){const was=drag.active;dragEnd(true);if(was)drag.suppressClick=true}});
document.addEventListener('pointercancel',()=>dragEnd(false));
document.addEventListener('contextmenu',e=>{if(e.target.closest('.bar'))e.preventDefault()});
document.addEventListener('touchmove',e=>{if(drag.active)e.preventDefault()},{passive:false});

/* ============================================================
   10. EVENTS
   ============================================================ */
document.addEventListener('click',e=>{
  if(drag.suppressClick){drag.suppressClick=false;e.preventDefault();return}
  const t=e.target.closest('[data-view],[data-act],[data-b],[data-dog],[data-lang]');if(!t)return;
  if(t.dataset.lang){setLang(t.dataset.lang);return}
  if(t.dataset.view){view=t.dataset.view;closeSheet();render();window.scrollTo(0,0);return}
  if(t.dataset.dog&&!t.dataset.act){openDog(t.dataset.dog,t.dataset.from||'');return}
  if(t.dataset.b&&!t.dataset.act){openSheet(t.dataset.b);return}
  const a=t.dataset.act;
  if(a==='prev'){calStart=add(calStart,-7);render()}
  if(a==='next'){calStart=add(calStart,7);render()}
  if(a==='today'){calStart=add(TODAY,-3);render()}
  if(a==='an'){avail.n=Number(t.dataset.n);main.innerHTML=viewAvail();renderAvail()}
  if(a==='asize'){avail.sizes[Number(t.dataset.i)]=t.dataset.z;main.innerHTML=viewAvail();renderAvail()}
  if(a==='find')searchNew();
  if(a==='savedog')saveDog();
  if(a==='assign')assign(Number(t.dataset.o));
  if(a==='close')closeSheet();
  if(a==='opendog')openDog(t.dataset.dog,t.dataset.from);
  if(a==='editdog')openDog(t.dataset.dog,t.dataset.from,true);
  if(a==='domove'){const sel=$('#mv');if(sel&&doMove(t.dataset.b2,sel.value))openSheet(t.dataset.b2)}
  if(a==='askcancel'){$('#cx').innerHTML=`<span>${T.cancel_q}</span><button class="btn danger fill sm" data-act="docancel" data-b2="${t.dataset.b2}">${T.yes_cancel}</button><button class="btn sm" data-act="nocancel" data-b2="${t.dataset.b2}">${T.no}</button>`}
  if(a==='nocancel')openSheet(t.dataset.b2);
  if(a==='docancel'){Store.deleteBooking(t.dataset.b2);closeSheet();render();toast(T.cancelled)}
});
document.addEventListener('change',e=>{
  const id=e.target.id||'';
  if(id==='av-s'||id==='av-e'){avail.s=$('#av-s').value;avail.e=$('#av-e').value;renderAvail()}
  if(id==='nf-fam')$('#nf-newfam').hidden=e.target.value!=='__new';
  if(id==='nf-n')draft.dogs.forEach((_,i)=>{$('#nf-blk'+i).hidden=i>=Number(e.target.value)});
});
function breedTyped(e){
  const id=e.target.id||'';const m=id.match(/^nf-d(\d)-breed$/);
  if(!m&&id!=='df-breed')return;
  const x=breedFind(e.target.value);if(!x)return;
  $(m?`#nf-d${m[1]}-size`:'#df-size').value=x[2];
}
document.addEventListener('input',breedTyped);
document.addEventListener('change',breedTyped);
/* forms never submit natively (some embedded previews block it): buttons and Enter are handled here */
document.addEventListener('submit',e=>e.preventDefault());
document.addEventListener('keydown',e=>{if(e.key!=='Enter'||e.target.tagName!=='INPUT')return;const f=e.target.closest('#nf,#df');if(!f)return;e.preventDefault();e.target.blur();f.id==='nf'?searchNew():saveDog()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});

/* ---- boot ---- */
document.documentElement.lang=lang;
if(location.search.includes('reset')){LS.del(LocalAdapter.KEY);try{history.replaceState(null,'',location.pathname+location.hash)}catch(e){}}
chrome();
Store.init().then(render);
</script>
